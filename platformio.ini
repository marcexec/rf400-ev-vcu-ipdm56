; PlatformIO Project Configuration File
; Suzuki RF400 EV - Vehicle Control Unit (VCU) Firmware
; Hardware: iPDM56 v1.1 (ATmega328P @ 16MHz, Dual PCA9539PW)
; Bootloader & Upload: Arduino Uno compatible (115200 baud)

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++11


mupload_flags =
    -V
